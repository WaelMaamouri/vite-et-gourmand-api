security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # ✅ ICI (pas dans firewalls)
    access_control:
        - { path: ^/api/auth/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/menus, roles: PUBLIC_ACCESS }
        - { path: ^/api/avis$, roles: PUBLIC_ACCESS }

        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/employe, roles: ROLE_EMPLOYE }
        - { path: ^/api/commandes, roles: ROLE_USER }

        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
